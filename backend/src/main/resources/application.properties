spring.application.name=backend
server.port=8011

# JWT 서명 키 (32자 이상, 운영에서는 환경변수로 설정)
jwt.secret=${JWT_SECRET:ncafe-jwt-secret-key-min-32-characters-long}

# DB URL: Docker는 compose에서 SPRING_DATASOURCE_URL=...db:5432... 로 덮어씀.
# 로컬 bootRun: 기본 localhost:5432. DB가 다른 포트(예 5411)면 .env에 POSTGRES_PORT 넣고 run-local.sh 사용.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ncafedb}
spring.datasource.username=ncafe
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:new_ibm2}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.use_sql_comments=true
# data.sql 실행 타이밍: 테이블 생성 후에 실행
spring.jpa.defer-datasource-initialization=true





# 업로드 이미지 서빙 경로. bootRun 시 ./upload(=backend/upload), Docker 시 /app/upload (환경변수 APP_UPLOAD_PATH로 덮어쓰기)
app.upload.path=file:./upload/
spring.web.resources.static-locations=file:/app/upload/, file:./upload/, classpath:/static/
spring.mvc.static-path-pattern=/**
