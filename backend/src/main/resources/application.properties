spring.application.name=backend
server.port=8011

# JWT — 환경변수 JWT_SECRET 또는 application-local.properties (profile=local) 에서 설정
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# DB — 환경변수 SPRING_DATASOURCE_* 또는 application-local.properties (profile=local) 에서 설정
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# DB 초기화: DataInitializer(Java)가 classpath:data.sql 실행. Spring 기본 SQL 자동 실행 비활성화.
spring.sql.init.mode=never

# JPA 설정 — 한국 시간(KST) 사용
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# 브라우저에서 접근할 URL 패턴
spring.mvc.static-path-pattern=/**

# 실제 이미지가 저장된 물리적 경로 (마지막에 / 필수). 로컬 bootRun = backend/upload
spring.web.resources.static-locations=file:./upload/,classpath:/static/
# 관리자 이미지 업로드 저장 디렉터리
app.upload.dir=./upload

# 포트원(아임포트) V1 — 결제 검증용 (REST API Key / Secret). 비우면 검증 생략.
portone.api-key=${PORTONE_API_KEY:}
portone.api-secret=${PORTONE_API_SECRET:}
