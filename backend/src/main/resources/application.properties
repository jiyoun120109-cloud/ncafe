spring.application.name=backend
server.port=8011

# JWT — 환경변수 JWT_SECRET 또는 application-local.properties (profile=local) 에서 설정
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# DB — 환경변수 SPRING_DATASOURCE_* 또는 application-local.properties (profile=local) 에서 설정
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# DB 초기화: DataInitializer(Java)가 classpath:data.sql 실행. Spring 기본 SQL 자동 실행 비활성화.
spring.sql.init.mode=never

# Flyway: 기존 DB(테이블 있음, flyway_schema_history 없음)에서도 마이그레이션 허용
spring.flyway.baseline-on-migrate=true

# JPA 설정 — 한국 시간(KST) 사용
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# 브라우저에서 접근할 URL 패턴
spring.mvc.static-path-pattern=/**

# 실제 이미지가 저장된 물리적 경로 (마지막에 / 필수). 로컬 bootRun = backend/upload
spring.web.resources.static-locations=file:./upload/,classpath:/static/
# 관리자 이미지 업로드 저장 디렉터리
app.upload.dir=./upload

# 메일 — 비밀번호 초기화 시 회원 이메일 발송. 비우면 발송 생략(알림만 동작).
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
# 발신 주소 (비우면 spring.mail.username 사용)
app.mail.from=${APP_MAIL_FROM:}

# 토스페이먼츠 — 결제 승인(confirm) 검증용. 비우면 검증 생략.
toss.secret-key=${TOSS_SECRET_KEY}
# 프론트엔드용 클라이언트 키는 NEXT_PUBLIC_TOSS_CLIENT_KEY 로 설정
toss.client-key=${TOSS_CLIENT_KEY}
