spring.application.name=backend
server.port=8011

# JWT 서명 키 (32자 이상, 운영에서는 환경변수로 설정)
jwt.secret=${JWT_SECRET:ncafe-jwt-secret-key-min-32-characters-long}

spring.datasource.url=jdbc:postgresql://localhost:5432/ncafedb
spring.datasource.username=ncafe
spring.datasource.password=new_ibm2
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.use_sql_comments=true
# data.sql 실행 타이밍: 테이블 생성 후에 실행
spring.jpa.defer-datasource-initialization=true





# 업로드 이미지 서빙 경로 (Next.js rewrite /images/** → 백엔드 /** 로 프록시됨)
spring.web.resources.static-locations=file:/app/upload/, file:/home/yun/dist/ncafe/backend/upload/, file:./upload/, classpath:/static/
spring.mvc.static-path-pattern=/**
