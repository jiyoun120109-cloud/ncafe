spring.application.name=backend
server.port=8011

# JWT — 환경변수 JWT_SECRET 또는 application-local.properties (profile=local) 에서 설정
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# DB — 환경변수 SPRING_DATASOURCE_* 또는 application-local.properties (profile=local) 에서 설정
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA 설정
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# 브라우저에서 접근할 URL 패턴
spring.mvc.static-path-pattern=/**

# 실제 이미지가 저장된 물리적 경로 (마지막에 / 필수). 로컬 bootRun = backend/upload
spring.web.resources.static-locations=file:./upload/,classpath:/static/
