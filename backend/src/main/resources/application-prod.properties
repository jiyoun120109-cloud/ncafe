# === Production Profile (DeplyGuid) ===
# docker-compose에서 SPRING_PROFILES_ACTIVE=prod 로 활성화됨

# 컨테이너 내부 포트 고정
server.port=8011

# 브라우저에서 접근할 URL 패턴
spring.mvc.static-path-pattern=/**

# 도커: WORKDIR /app 이므로 file:./upload/ → /app/upload (볼륨 마운트)
spring.web.resources.static-locations=file:./upload/,classpath:/static/

# JPA: prod에서는 DDL 비사용. 스키마는 data.sql(DataInitializer)로 관리. (update 시 user_id integer→bigint ALTER가 USING 없이 실패함)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
