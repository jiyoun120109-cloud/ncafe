# DeplyGuid: 내부 포트 고정(backend=8011, frontend=3011, db=5432, agent=8000), 외부 포트는 .env
name: yun_ncafe

services:
  agent-server:
    build:
      context: ./agent-server
      dockerfile: Dockerfile
    image: ${USER_ID:-yun}-agent:latest
    container_name: ${USER_ID:-yun}-agent
    # CI/배포: 워크플로에서 GEMINI_API_KEY 환경변수로 전달. 로컬: 루트 .env 또는 agent-server/.env 로드 후 compose 실행
    # RAG: 아래 db와 같은 컨테이너(yun-db) 사용. 별도 DB 컨테이너 불필요. RAG_DATABASE_URL 설정 시 ncafedb에 rag_documents 테이블·vector 확장 사용.
    environment:
      - TZ=Asia/Seoul
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - RAG_DATABASE_URL=${RAG_DATABASE_URL:-}
      - BACKEND_BASE=http://backend:8011
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ${USER_ID:-yun}-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${USER_ID:-yun}-backend
    # BFF만 노출. 백엔드는 BFF가 내부(backend:8011)로만 호출
    # ports:
    #   - "${BACKEND_PORT:-8011}:8011"
    volumes:
      - /home/yun/upload:/app/upload
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/ncafedb?currentSchema=public}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-ncafe}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - APP_UPLOAD_PATH=file:/app/upload/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--timeout=2", "http://localhost:8011/api/menus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${USER_ID:-yun}-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://eunami.newlecture.com}
        - API_BASE_URL=http://backend:8011
        - NEXT_PUBLIC_KAKAO_MAP_APP_KEY=${NEXT_PUBLIC_KAKAO_MAP_APP_KEY}
        - NEXT_PUBLIC_TOSS_CLIENT_KEY=${NEXT_PUBLIC_TOSS_CLIENT_KEY}
    container_name: ${USER_ID:-yun}-frontend
    ports:
      - "${FRONTEND_PORT:-3011}:3011"
    environment:
      - TZ=Asia/Seoul
      - API_BASE_URL=http://backend:8011
      - AGENT_SERVER_URL=http://agent-server:8000
      - SESSION_SECRET=${SESSION_SECRET}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://eunami.newlecture.com}
      - NEXT_PUBLIC_KAKAO_MAP_APP_KEY=${NEXT_PUBLIC_KAKAO_MAP_APP_KEY}
      - NEXT_PUBLIC_TOSS_CLIENT_KEY=${NEXT_PUBLIC_TOSS_CLIENT_KEY}
    depends_on:
      backend:
        condition: service_healthy
      agent-server:
        condition: service_started
    restart: unless-stopped

  db:
    # pgvector 포함 이미지 — RAG 임베딩 저장 시 vector 확장 사용. 백엔드(메뉴/주문 등)와 agent-server(RAG) 모두 이 컨테이너 하나 사용.
    image: pgvector/pgvector:pg17
    container_name: ${USER_ID:-yun}-db
    environment:
      POSTGRES_DB: ncafedb
      POSTGRES_USER: ncafe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    # ports:
    #   - "${DB_PORT:-5511}:5432"
    volumes:
      - /home/yun/data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncafe -d ncafedb"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

