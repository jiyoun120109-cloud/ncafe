name: ncafe-yun
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8011:8011"
    volumes:
      - ./backend/upload:/app/upload
    environment:
      - SERVER_PORT=8011
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ncafedb
      - SPRING_DATASOURCE_USERNAME=ncafe
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-new_ibm2}
      - JWT_SECRET=${JWT_SECRET:-ncafe-jwt-secret-key-min-32-characters-long}
      - APP_UPLOAD_PATH=file:/app/upload/
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://eunami.newlecture.com
        - BACKEND_URL=http://backend:8011
    ports:
      - "3011:3011"
    environment:
      - NEXT_PUBLIC_API_URL=https://eunami.newlecture.com
      - BACKEND_URL=http://backend:8011
      - PORT=3011
    depends_on:
      - backend

  db:
    image: postgres:17
    container_name: ${USER_ID:-ncafe}-db
    environment:
      POSTGRES_DB: ncafedb
      POSTGRES_USER: ncafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-new_ibm2}
    # 호스트 포트: 5432/5433 사용 중이면 .env에 POSTGRES_PORT=5434 등 빈 포트로 지정
    ports:
      - "${POSTGRES_PORT:-5411}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncafe -d ncafedb"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s
