# DeplyGuid: main push 또는 workflow_dispatch 시 self-hosted에서 배포
# GitHub Variables (Settings → Secrets and variables → Actions → Variables):
#   COMPOSE_PROJECT_NAME, USER_ID, FRONTEND_PORT, NEXT_PUBLIC_API_URL
# GitHub Secrets (Settings → Secrets and variables → Actions → Secrets):
#   SESSION_SECRET, JWT_SECRET, DB_PASSWORD, GEMINI_API_KEY,
#   NEXT_PUBLIC_KAKAO_MAP_APP_KEY, NEXT_PUBLIC_TOSS_CLIENT_KEY, TOSS_SECRET_KEY
name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      # Node.js 20 액션 사용 중단 안내 대응 — 2026년 6월부터 기본이 Node 24로 변경됨
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure backend/upload for Docker build
        run: mkdir -p backend/upload && touch backend/upload/.gitkeep

      - name: Ensure host volume directories
        run: |
          mkdir -p /home/yun/upload /home/yun/data
          chmod 755 /home/yun/upload /home/yun/data 2>/dev/null || true

      - name: Copy seed images to host upload
        run: |
          # 레포의 backend/upload에 있는 이미지를 호스트 /home/yun/upload로 복사 (기존 파일은 덮어쓰지 않음)
          for f in backend/upload/*; do
            [ -f "$f" ] && cp -n "$f" /home/yun/upload/ 2>/dev/null || true
          done

      - name: Create .env file
        run: |
          echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-yun_ncafe}" > .env
          echo "USER_ID=${USER_ID:-yun}" >> .env
          echo "FRONTEND_PORT=${FRONTEND_PORT:-3011}" >> .env
          echo "SESSION_SECRET=${SESSION_SECRET}" >> .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env
          echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" >> .env
          echo "NEXT_PUBLIC_KAKAO_MAP_APP_KEY=${NEXT_PUBLIC_KAKAO_MAP_APP_KEY}" >> .env
          echo "NEXT_PUBLIC_TOSS_CLIENT_KEY=${NEXT_PUBLIC_TOSS_CLIENT_KEY}" >> .env
          echo "TOSS_SECRET_KEY=${TOSS_SECRET_KEY}" >> .env
          # RAG: agent-server가 같은 DB(ncafedb)에 pgvector로 문서 임베딩 저장. 미설정 시 메모리만 사용해 배포에서 문서 저장이 동작하지 않음.
          echo "RAG_DATABASE_URL=postgresql://ncafe:${DB_PASSWORD}@db:5432/ncafedb" >> .env
        env:
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          USER_ID: ${{ vars.USER_ID }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
          NEXT_PUBLIC_TOSS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}

      - name: Build and Deploy
        run: docker compose --profile with-db up --build -d

      - name: Verify deployment
        run: |
          echo "=== Container Status ==="
          docker compose ps
          sleep 15
          echo ""
          echo "=== Health Check ==="
          curl -sf --max-time 10 -o /dev/null -w "Frontend : HTTP %{http_code}\n" http://localhost:${FRONTEND_PORT:-3011} || echo "Frontend : not responding"
        env:
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}

      - name: Clean up old images
        run: docker image prune -f
