# push 시 빌드 검사 → Docker 이미지 빌드 → (선택) 배포 서버 SSH 배포
#
# [배포 사용 시]
# 1. GitHub 저장소 → Settings → Variables and secrets → Actions
#    - Variables: DEPLOY_ENABLED = true
#    - Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, (선택) REMOTE_PATH
# 2. REMOTE_PATH: 서버에서 프로젝트 경로 (예: ~/dist/ncafe). 없으면 ~/dist/ncafe 사용
name: Build and Deploy

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compile
        working-directory: backend
        run: ./gradlew compileJava --no-daemon

  frontend-check:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://placeholder
        run: |
          npm ci
          npm run build

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker Compose
        run: docker compose build --no-cache

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    if: success() && vars.DEPLOY_ENABLED == 'true'
    environment: production
    env:
      REMOTE_PATH: ${{ secrets.REMOTE_PATH || '~/dist/ncafe' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ env.REMOTE_PATH }}
            git pull origin main
            docker compose up -d --build
            docker image prune -f
